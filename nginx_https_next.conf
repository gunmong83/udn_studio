# Nginx includes conf.d files from the http context. Keep the proxy source
# address separate from the visitor address: direct callers must not be able
# to forge CF-Connecting-IP and appear to be Cloudflare.
geo $udn_is_cloudflare_proxy {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}

map $udn_is_cloudflare_proxy $udn_client_ip {
  0 $remote_addr;
  1 $http_cf_connecting_ip;
}

# 1) www -> root 로 리다이렉트
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.studioundesignated.com;

  ssl_certificate     /etc/letsencrypt/live/studioundesignated.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/studioundesignated.com/privkey.pem;

  return 301 https://studioundesignated.com$request_uri;
}

# 2) root 도메인에서 Next.js 서비스
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name studioundesignated.com;

  ssl_certificate     /etc/letsencrypt/live/studioundesignated.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/studioundesignated.com/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;

  # Do not serve the application to a discovered origin IP. Cloudflare is the
  # only public reverse proxy permitted to reach this virtual host.
  if ($udn_is_cloudflare_proxy = 0) { return 403; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Powered-By "" always;

  location / {
    # Docker publishes the application to this loopback-only host port.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $udn_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header X-Powered-By;
  }
}
