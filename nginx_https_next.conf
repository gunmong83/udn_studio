# 1) www -> root 로 리다이렉트
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.studioundesignated.com;

  ssl_certificate     /etc/letsencrypt/live/studioundesignated.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/studioundesignated.com/privkey.pem;

  return 301 https://studioundesignated.com$request_uri;
}

# 2) root 도메인에서 Next.js 서비스
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name studioundesignated.com;

  ssl_certificate     /etc/letsencrypt/live/studioundesignated.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/studioundesignated.com/privkey.pem;

  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
