name: Deploy to Lightsail (Local Build & Sync)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to Lightsail via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || secrets.EC2_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: 22
          source: "web/dist/*"
          target: "/tmp/udn_studio_deploy"
          strip_components: 2

      - name: Move to Nginx Root via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || secrets.EC2_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            NGINX_ROOT="/usr/share/nginx/html"
            TEMP_DIR="/tmp/udn_studio_deploy"
            
            # Clean and move files to nginx root
            sudo rm -rf "${NGINX_ROOT:?}"/*
            sudo cp -r "$TEMP_DIR"/* "$NGINX_ROOT/"
            sudo rm -rf "$TEMP_DIR"
            
            sudo systemctl reload nginx || true
            echo "Deployment successful."
