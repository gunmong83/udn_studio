name: Deploy to Lightsail (git pull -> npm build -> sync to nginx)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || secrets.EC2_HOST }}          # e.g. 54.180.191.104
          username: ${{ secrets.LIGHTSAIL_USER || secrets.EC2_USER }}      # e.g. admin
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.EC2_SSH_KEY }}     # PEM contents as a secret
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.APP_DIR || '/home/admin/source/udn_studio' }}"
            BRANCH="main"
            REPO_SSH="git@github.com:${{ github.repository }}.git"
            GH_TOKEN="${{ secrets.GITHUB_TOKEN || '' }}"
            REPO_URL="$REPO_SSH"
            if [ -n "$GH_TOKEN" ]; then
              REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            fi

            # Ensure repo exists and is on the desired branch
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              mkdir -p "$APP_DIR"
              git clone "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
              git checkout "$BRANCH"
            fi

            # Build web app
            cd "$APP_DIR/web"
            npm ci
            npm run build

            # Deploy built assets to nginx root
            DIST_SRC="$APP_DIR/web/dist/"
            NGINX_ROOT="/usr/share/nginx/html"
            if [ ! -d "$DIST_SRC" ]; then
              echo "dist directory missing after build" >&2
              exit 1
            fi
            sudo rsync -av --delete "$DIST_SRC" "$NGINX_ROOT/"

            sudo systemctl reload nginx || true
            echo "Deployment complete."
