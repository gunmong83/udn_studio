name: Deploy to Lightsail

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-lightsail
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build standalone web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Create deploy bundle
        run: |
          rm -rf deploy_bundle
          mkdir -p deploy_bundle/app/.next
          cp -R web/.next/standalone/. deploy_bundle/app/
          cp -R web/.next/static deploy_bundle/app/.next/static
          cp -R web/public deploy_bundle/app/public
          tar -czf deploy_bundle/udn_next_deploy.tgz -C deploy_bundle app
          cp deploy_lightsail_next.sh deploy_bundle/
          cp nginx_https_next.conf deploy_bundle/https.conf

      - name: Upload deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || secrets.EC2_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.EC2_SSH_KEY }}
          source: "deploy_bundle/*"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on Lightsail via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || secrets.EC2_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY || secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            export NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://studioundesignated.com' }}"
            bash /tmp/deploy_lightsail_next.sh
