name: Production release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY after local staging has passed"
        required: true
        type: string
      release_note:
        description: "Short description of this release batch"
        required: true
        type: string
      purge_member_data:
        description: "Type PURGE to back up and remove all production member/order data"
        required: false
        default: "NO"
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/udn-studio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy image to Lightsail
        uses: appleboy/ssh-action@v1.2.0
        env:
          EPOST_POLLING_TOKEN: ${{ secrets.EPOST_POLLING_TOKEN }}
        with:
          host: ${{ secrets.LIGHTSAIL_UBUNTU_HOST }}
          username: ${{ secrets.LIGHTSAIL_UBUNTU_USER }}
          key: ${{ secrets.LIGHTSAIL_UBUNTU_KEY }}
          envs: EPOST_POLLING_TOKEN
          script_stop: true
          script: |
            set -eu
            if [ -z "${EPOST_POLLING_TOKEN:-}" ]; then
              echo 'EPOST_POLLING_TOKEN GitHub secret is missing.' >&2
              exit 1
            fi
            test -f /opt/udn_studio/.env.production
            sudo --preserve-env=EPOST_POLLING_TOKEN python3 -c 'import os,pathlib,tempfile; p=pathlib.Path("/opt/udn_studio/.env.production"); t=os.environ["EPOST_POLLING_TOKEN"]; assert t and "\n" not in t and "\r" not in t, "EPOST_POLLING_TOKEN is malformed"; lines=[line for line in p.read_text().splitlines() if not line.startswith("EPOST_POLLING_TOKEN=")]; lines.append("EPOST_POLLING_TOKEN="+t); content="\n".join(lines)+"\n"; fd,tmp=tempfile.mkstemp(prefix=".env.production.",dir=p.parent); out=os.fdopen(fd,"w"); out.write(content); out.flush(); os.fsync(out.fileno()); out.close(); os.chmod(tmp,0o600); os.replace(tmp,p)'
            echo 'EPOST polling token configured in the production environment.'
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/udn-studio:${{ github.sha }}"
            sudo docker pull "$IMAGE"
            # The hardened Nginx virtual-host is versioned with the image so
            # app and origin-protection changes are released together.
            sudo docker rm -f udn-nginx-config >/dev/null 2>&1 || true
            sudo docker create --name udn-nginx-config "$IMAGE" >/dev/null
            sudo docker cp udn-nginx-config:/nginx_https_next.conf /tmp/udn-https.conf
            sudo docker rm udn-nginx-config >/dev/null
            sudo mkdir -p /opt/udn_studio /data
            for name in EPOST_SERVICE_KEY SENS_ALIMTALK_SERVICE_ID SENS_ALIMTALK_CHANNEL_ID SENS_ACCESS_KEY SENS_SECRET_KEY; do
              if ! sudo grep -q "^${name}=." /opt/udn_studio/.env.production; then
                echo "${name} is missing from the production environment." >&2
                exit 1
              fi
            done
            # NICEPAY v1 서버승인은 ClientKey(R2_ 운영 / S2_ 테스트)와
            # SecretKey를 Basic 인증에 사용한다. 구형 배포 설정의
            # NICEPAY_MERCHANT_KEY도 호환 목적으로 허용하되 값은 출력하지 않는다.
            if ! sudo grep -qE '^NICEPAY_(CLIENT_ID|MERCHANT_KEY)=.' /opt/udn_studio/.env.production; then
              echo 'NICEPAY_CLIENT_ID is missing from the production environment.' >&2
              exit 1
            fi
            if sudo grep -qE '^NICEPAY_(CLIENT_ID|MERCHANT_KEY)=S2_' /opt/udn_studio/.env.production; then
              echo 'A NICEPAY test client key is configured. Set the live R2_ client key before deploying.' >&2
              exit 1
            fi
            if ! sudo grep -q '^NICEPAY_SECRET_KEY=.' /opt/udn_studio/.env.production; then
              echo 'NICEPAY_SECRET_KEY is missing from the production environment.' >&2
              exit 1
            fi
            if ! sudo grep -q '^AUTH_URL=https://studioundesignated.com' /opt/udn_studio/.env.production; then
              echo 'AUTH_URL must be https://studioundesignated.com in production.' >&2
              exit 1
            fi
            # Back up the live SQLite database before the new container runs
            # Prisma schema synchronization. SQLite's online backup API keeps
            # this consistent without stopping the current app.
            test -s /data/udn.db
            BACKUP_DIR=/data/backups
            BACKUP_TMP="$BACKUP_DIR/.udn-${{ github.run_id }}.sqlite"
            BACKUP_FILE="$BACKUP_DIR/udn-${{ github.sha }}-${{ github.run_id }}.sqlite.gz"
            sudo mkdir -p "$BACKUP_DIR"
            sudo chmod 700 "$BACKUP_DIR"
            trap 'sudo rm -f "$BACKUP_TMP" "$BACKUP_TMP.gz"' EXIT
            sudo python3 -c 'import sqlite3,sys; source=sqlite3.connect("/data/udn.db",timeout=30); target=sqlite3.connect(sys.argv[1],timeout=30); source.backup(target,pages=256,sleep=0.05); assert target.execute("PRAGMA integrity_check").fetchone()==("ok",), "SQLite backup integrity check failed"; target.close(); source.close()' "$BACKUP_TMP"
            sudo gzip -f "$BACKUP_TMP"
            sudo mv "$BACKUP_TMP.gz" "$BACKUP_FILE"
            sudo chmod 600 "$BACKUP_FILE"
            sudo gzip -t "$BACKUP_FILE"
            sudo du -h "$BACKUP_FILE"
            sudo find "$BACKUP_DIR" -maxdepth 1 -type f -name 'udn-*.sqlite.gz' -mtime +30 -delete
            trap - EXIT
            sudo docker rm -f udn-web-new >/dev/null 2>&1 || true
            # Port 3001 is the stable local Nginx upstream. Stop the previous
            # container before binding it so repeated deployments are safe.
            sudo docker rm -f udn-web >/dev/null 2>&1 || true
            sudo docker run -d --name udn-web-new --restart unless-stopped \
              --env-file /opt/udn_studio/.env.production \
              -e NODE_ENV=production -e HOSTNAME=0.0.0.0 -e PORT=3000 \
              -e DATABASE_URL=file:/data/udn.db \
              -p 127.0.0.1:3001:3000 -v /data:/data "$IMAGE"
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:3001/ >/dev/null && break || sleep 2
            done
            curl -fsS http://127.0.0.1:3001/ >/dev/null
            # Verify the runtime Next config is loaded by exercising the
            # low-quality preview requested by ProgressiveImage.
            curl -fsS 'http://127.0.0.1:3001/_next/image?url=%2Fassets%2Fproducts%2Fche-card-2026%2Fmain.jpg&w=3840&q=20' -o /dev/null
            if [ "${{ inputs.purge_member_data }}" = "PURGE" ]; then
              test -f /data/udn.db
              BACKUP="/data/udn.db.before-member-purge-${{ github.run_id }}"
              sudo cp -p /data/udn.db "$BACKUP"
              sudo docker exec udn-web-new node --input-type=module -e '
                import { PrismaClient } from "@prisma/client";
                const prisma = new PrismaClient();
                await prisma.$transaction([
                  prisma.orderItem.deleteMany({}),
                  prisma.order.deleteMany({}),
                  prisma.cartItem.deleteMany({}),
                  prisma.account.deleteMany({}),
                  prisma.user.deleteMany({})
                ]);
                await prisma.$disconnect();
              '
              echo "Production member/order data removed; backup saved at $BACKUP"
            fi
            sudo systemctl stop udn-next || true
            sudo docker rm -f udn-web >/dev/null 2>&1 || true
            sudo docker rename udn-web-new udn-web
            NGINX_BACKUP="/etc/nginx/conf.d/https.conf.bak.${{ github.run_id }}"
            sudo cp /etc/nginx/conf.d/https.conf "$NGINX_BACKUP"
            sudo cp /tmp/udn-https.conf /etc/nginx/conf.d/https.conf
            if ! sudo nginx -t; then
              sudo cp "$NGINX_BACKUP" /etc/nginx/conf.d/https.conf
              exit 1
            fi
            sudo systemctl reload nginx
