name: Build, Push, Deploy (Lightsail)

on:
  workflow_dispatch:

jobs:
  build_push_deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build image (Makefile build-web)
        run: make build-web

      - name: Push image (Makefile push-web)
        run: make push-web

      - name: Deploy on Lightsail via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_UBUNTU_HOST }}
          username: ${{ secrets.LIGHTSAIL_UBUNTU_USER }}
          key: ${{ secrets.LIGHTSAIL_UBUNTU_KEY }}
          script: |
            set -euo pipefail
            IMAGE="gunmong/udn_home"
            CONTAINER="stdudioudn-home"
            CERT_DIR="/opt/udn_certs"

            sudo mkdir -p "$CERT_DIR"
            echo "${{ secrets.TLS_FULLCHAIN_PEM }}" | sudo tee "$CERT_DIR/fullchain.pem" >/dev/null
            echo "${{ secrets.TLS_PRIVKEY_PEM }}" | sudo tee "$CERT_DIR/privkey.pem" >/dev/null
            sudo chmod 600 "$CERT_DIR/fullchain.pem" "$CERT_DIR/privkey.pem"

            docker pull "$IMAGE"
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              -p 443:443 \
              -v "$CERT_DIR:/etc/nginx/certs:ro" \
              "$IMAGE"
