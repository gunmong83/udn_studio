name: Build, Push, Deploy (Lightsail)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create deploy bundle
        run: |
          rm -rf deploy_bundle
          mkdir -p deploy_bundle
          tar \
            --exclude='web/node_modules' \
            --exclude='web/.next' \
            --exclude='web/prisma/dev.db' \
            --exclude='web/*.log' \
            -czf deploy_bundle/udn_next_deploy.tgz web
          cp deploy_lightsail_next.sh deploy_bundle/
          cp nginx_https_next.conf deploy_bundle/https.conf

      - name: Upload deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_UBUNTU_HOST }}
          username: ${{ secrets.LIGHTSAIL_UBUNTU_USER }}
          key: ${{ secrets.LIGHTSAIL_UBUNTU_KEY }}
          source: "deploy_bundle/*"
          target: "/tmp"
          strip_components: 1

      - name: Deploy on Lightsail via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_UBUNTU_HOST }}
          username: ${{ secrets.LIGHTSAIL_UBUNTU_USER }}
          key: ${{ secrets.LIGHTSAIL_UBUNTU_KEY }}
          script: |
            set -euo pipefail
            export DATABASE_URL="${{ secrets.DATABASE_URL || 'file:/opt/udn_studio/data/dev.db' }}"
            export NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://studioundesignated.com' }}"
            export NEXT_PUBLIC_TOSS_CLIENT_KEY="${{ secrets.NEXT_PUBLIC_TOSS_CLIENT_KEY }}"
            export TOSS_SECRET_KEY="${{ secrets.TOSS_SECRET_KEY }}"
            bash /tmp/deploy_lightsail_next.sh
