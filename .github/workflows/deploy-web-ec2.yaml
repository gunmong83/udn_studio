name: Deploy to EC2 (clone -> build Dockerfile -> docker run)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # ---- configurable ----
            APP_DIR="${{ secrets.APP_DIR }}"
            REPO_SSH="git@github.com:${{ github.repository }}.git"
            # Use GITHUB_TOKEN (if provided) to clone via HTTPS to avoid SSH key requirement.
            GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            REPO_URL="$REPO_SSH"
            if [ -n "${GH_TOKEN:-}" ]; then
              REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            fi
            BRANCH="main"

            IMAGE_NAME="${{ secrets.IMAGE_NAME }}"
            CONTAINER_NAME="${{ secrets.CONTAINER_NAME }}"
            PORTS="${{ secrets.PORTS }}"      # e.g. "80:8080"
            ENV_VARS="${{ secrets.ENV_VARS || '' }}"  # e.g. "A=1,B=2"
            # ----------------------

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # GitHub host key (avoid interactive prompt)
            mkdir -p ~/.ssh
            touch ~/.ssh/known_hosts
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            REPO_DIR="$(basename '${{ github.repository }}')"

            # 1) clone or update (use token-based HTTPS if GH_TOKEN available)
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "Cloning repo..."
              git clone --depth 1 --branch "$BRANCH" "$REPO_URL" "$REPO_DIR"
              # Avoid leaving token in .git/config — set remote to token-less URL for safety
              if [ -n "${GH_TOKEN:-}" ]; then
                cd "$REPO_DIR"
                git remote set-url origin "https://github.com/${{ github.repository }}.git" || true
                cd ..
              fi
            else
              echo "Updating repo..."
              cd "$REPO_DIR"
              if [ -n "${GH_TOKEN:-}" ]; then
                # Use extra header to authenticate fetch/reset without persisting token in config
                git -c http.extraHeader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch origin "$BRANCH"
                git -c http.extraHeader="AUTHORIZATION: bearer ${GH_TOKEN}" reset --hard "origin/$BRANCH"
              else
                git fetch origin "$BRANCH"
                git reset --hard "origin/$BRANCH"                # If no GH_TOKEN, ensure origin uses SSH to avoid HTTPS credential prompts
                if [ -z "${GH_TOKEN:-}" ]; then
                  CURRENT_URL="$(git remote get-url origin || true)"
                  if echo "$CURRENT_URL" | grep -q '^https://'; then
                    echo "Switching origin to SSH URL"
                    git remote set-url origin "$REPO_SSH"
                  fi
                fi
              fi
              cd ..
            fi

            cd "$REPO_DIR"

            # 2) build image using docker/Dockerfile
            echo "Building Docker image..."
            sudo docker build \
              -f docker/Dockerfile \
              -t "${IMAGE_NAME}:${{ github.sha }}" \
              -t "${IMAGE_NAME}:latest" \
              .

            # 3) stop/remove existing container (if any)
            echo "Replacing container if exists..."
            sudo docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            # 4) docker run
            # Build --env flags from ENV_VARS (comma-separated)
            ENV_FLAGS=""
            if [ -n "${ENV_VARS:-}" ]; then
              IFS=',' read -ra PAIRS <<< "$ENV_VARS"
              for kv in "${PAIRS[@]}"; do
                ENV_FLAGS="$ENV_FLAGS --env $kv"
              done
            fi

            echo "Running container..."
            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$PORTS" \
              $ENV_FLAGS \
              "${IMAGE_NAME}:${{ github.sha }}"

            echo "Done."
            sudo docker ps --filter "name=$CONTAINER_NAME"
