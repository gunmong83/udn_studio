name: Check EPOST delivery status

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: epost-hourly-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check active EPOST shipments
        env:
          EPOST_POLLING_TOKEN: ${{ secrets.EPOST_POLLING_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$EPOST_POLLING_TOKEN" ]; then
            echo "GitHub repository secret EPOST_POLLING_TOKEN is not configured." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${EPOST_POLLING_TOKEN}" \
            --header "Accept: application/json" \
            https://studioundesignated.com/api/cron/epost-tracking
